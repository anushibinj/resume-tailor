services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-tailor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_tailor}
      POSTGRES_USER: ${POSTGRES_USER:-resume_tailor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_tailor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - resume_tailor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_tailor} -d ${POSTGRES_DB:-resume_tailor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-tailor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Database connection inside Docker network
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-resume_tailor}
      DATABASE_USERNAME: ${POSTGRES_USER:-resume_tailor}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-resume_tailor}
      SERVER_PORT: 8080
      # CORS configuration
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Secrets and Auth
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      # Default LLM settings
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8000}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      SUMMARY_CHARS_PER_LINE: ${SUMMARY_CHARS_PER_LINE:-90}
      # PDF export settings
      PDF_ENABLED: ${PDF_ENABLED:-true}
      DOCKER_BINARY: ${DOCKER_BINARY:-docker}
      TEX_IMAGE: ${TEX_IMAGE:-resume-tailor-tex}
      PDF_TIMEOUT_SECONDS: ${PDF_TIMEOUT_SECONDS:-120}
      PDF_MEMORY_LIMIT: ${PDF_MEMORY_LIMIT:-1g}
      PDF_CPU_LIMIT: ${PDF_CPU_LIMIT:-2}
      PDF_ARTIFACT_PATH: ${PDF_ARTIFACT_PATH:-./artifacts}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - resume_tailor_artifacts:/app/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    container_name: resume-tailor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - path: ./frontend/.env.local
        required: false
      - path: ./frontend/.env
        required: false
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  resume_tailor_pgdata:
  resume_tailor_artifacts:
