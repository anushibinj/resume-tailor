server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resume-tailor-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/resume_tailor}
    username: ${DATABASE_USERNAME:resume_tailor}
    password: ${DATABASE_PASSWORD:resume_tailor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:2MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:4MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

resume-tailor:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    # Base64-encoded 32 random bytes. Encrypts LLM API keys at rest (AES-256-GCM).
    # Generate with: openssl rand -base64 32
    encryption-key: ${ENCRYPTION_KEY:}
  google:
    # OAuth 2.0 Web client ID from Google Cloud Console (APIs & Services > Credentials).
    # Doubles as the audience every Google Sign-In ID token is verified against.
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt:
    # Signs the app's own session tokens issued after a Google sign-in. At least 32 bytes.
    # Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  llm:
    # Seeds a "Default" LLM profile for a brand-new user's first Google sign-in, when an
    # API key is present. Profiles are managed from the Settings UI afterwards.
    default-base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    default-api-key: ${LLM_API_KEY:}
    default-model: ${LLM_MODEL:gpt-4o-mini}
    default-temperature: ${LLM_TEMPERATURE:0.2}
    default-max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:8000}
    request-timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
  pdf:
    enabled: ${PDF_ENABLED:true}
    docker-binary: ${DOCKER_BINARY:docker}
    image: ${TEX_IMAGE:resume-tailor-tex}
    compile-timeout-seconds: ${PDF_TIMEOUT_SECONDS:120}
    memory-limit: ${PDF_MEMORY_LIMIT:1g}
    cpu-limit: ${PDF_CPU_LIMIT:2}
    artifact-path: ${PDF_ARTIFACT_PATH:./artifacts}

logging:
  level:
    com.resumetailor: ${LOG_LEVEL:INFO}
